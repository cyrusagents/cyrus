packages:
  - packages/*
  - apps/*

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - sharp
  - workerd

overrides:
  '@opentelemetry/core': '>=2.8.0'
  uuid: '>=11.1.1'
  body-parser: '>=2.3.0'
  js-yaml: '>=5.2.2'
  shell-quote: '>=1.9.0'
  simple-git: '>=3.36.0'
  systeminformation: '>=5.31.7'
  undici: '>=7.28.0'
  '@grpc/grpc-js': '>=1.14.4'
  ajv: '>=8.18.0'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.26'
  hono: '>=4.13.5'
  '@hono/node-server': '>=2.0.5'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
  semver@>=7.0.0 <7.5.2: '>=7.5.2'
  esbuild@<=0.24.2: '>=0.25.0'
  # Current direct owners already allow these patched releases but have no compatible bump to refresh the stale locks.
  proxy-addr@<2.0.8: '>=2.0.8'
  source-map-js@<1.2.2: '>=1.2.2'
